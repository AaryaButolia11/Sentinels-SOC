<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel · Analyst Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Shared design tokens (paper palette, fonts, accents) -->
    <link rel="stylesheet" href="/styles.css" />
    <!-- Backend API base URL. This site (dashboard) and the API are deployed
         as two separate Render services, so every API/WebSocket call needs
         the full backend URL — update this one line if the API service is
         ever renamed or redeployed elsewhere. -->
    <script>
      window.API_BASE = "https://sentinels-soc-api.onrender.com";
    </script>
    <style>
      /* ------------------------------------------------------------------
         Login page — the "cover sheet" of a restricted dossier.
         Self-contained styling so it never collides with the dashboard CSS.
         Signature: the product's own threat-arc map, rendered as faint
         ambient texture behind the access card.
         ------------------------------------------------------------------ */
      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        position: relative;
        overflow: hidden;
      }
      /* ambient graticule + arcs echoing the dashboard map */
      .login-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .login-bg svg {
        width: 100%;
        height: 100%;
      }
      .login-bg .grid-line {
        stroke: rgba(28, 26, 20, 0.05);
        stroke-width: 1;
      }
      .login-bg .arc {
        fill: none;
        stroke: var(--coral);
        stroke-width: 1.2;
        opacity: 0.16;
        stroke-dasharray: 5 300;
        stroke-dashoffset: 305;
        animation: arc-travel 7s ease-in-out infinite;
      }
      .login-bg .arc.a2 {
        stroke: var(--violet);
        animation-delay: 2.2s;
      }
      .login-bg .arc.a3 {
        stroke: var(--teal);
        animation-delay: 4.4s;
      }
      .login-bg .hq {
        fill: var(--teal);
        opacity: 0.5;
      }
      @keyframes arc-travel {
        0% {
          stroke-dashoffset: 305;
        }
        55% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .login-bg .arc {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 0.1;
        }
      }

      .cover {
        position: relative;
        z-index: 1;
        width: min(430px, 100%);
        background: var(--paper);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        box-shadow:
          0 1px 0 rgba(28, 26, 20, 0.04),
          0 24px 60px -30px rgba(28, 26, 20, 0.35);
        /* die-cut corner, the recurring alert-exhibit motif */
        clip-path: polygon(
          0 0,
          calc(100% - 26px) 0,
          100% 26px,
          100% 100%,
          0 100%
        );
      }
      .cover-inner {
        padding: 1.6rem 1.7rem 1.8rem;
      }
      .cover .letterhead {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }
      .cover .case-no {
        color: var(--ink-faint);
        border: none;
        padding: 0;
      }
      .cover .brand {
        margin: 1.15rem 0 1.35rem;
      }
      .stamp {
        position: absolute;
        top: 1.4rem;
        right: 2.1rem;
        transform: rotate(-9deg);
        border: 2px solid var(--coral);
        color: var(--coral);
        font-family: var(--font-mono);
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        padding: 0.28rem 0.5rem;
        border-radius: 3px;
        opacity: 0.72;
        text-transform: uppercase;
      }
      .cover h2 {
        margin: 0 0 0.15rem;
        font-family: var(--font-serif);
        font-weight: 600;
        font-size: 1.28rem;
      }
      .cover .lede {
        margin: 0 0 1.25rem;
        font-size: 0.82rem;
        color: var(--ink-dim);
        line-height: 1.45;
      }
      .field {
        display: grid;
        gap: 0.32rem;
        margin-bottom: 0.85rem;
      }
      .field label {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .field input {
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 0.62rem 0.7rem;
        background: var(--paper-2);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 0.85rem;
      }
      .field input:focus {
        outline: 2px solid rgba(53, 49, 140, 0.35);
        outline-offset: 1px;
      }
      .signin {
        all: unset;
        display: block;
        text-align: center;
        cursor: pointer;
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.68rem;
        border-radius: 6px;
        background: var(--ink);
        color: var(--paper);
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        transition: background 0.15s;
      }
      .signin:hover {
        background: var(--violet);
      }
      .signin:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        margin: 0.9rem 0 0;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--ink-faint);
        min-height: 1em;
      }
      .status.err {
        color: var(--coral);
      }
      .status.ok {
        color: var(--teal);
      }
      .cover-foot {
        border-top: 1px solid var(--line);
        padding: 0.7rem 1.7rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.64rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .cover-foot .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--teal);
      }
      .demo-hint {
        margin: 1rem auto 0;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--ink-faint);
      }
      .demo-hint b {
        color: var(--ink-dim);
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <!-- ambient product motif: threat arcs converging on SOC HQ -->
      <div class="login-bg" aria-hidden="true">
        <svg viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice">
          <g>
            <line class="grid-line" x1="0" y1="160" x2="1000" y2="160" />
            <line class="grid-line" x1="0" y1="320" x2="1000" y2="320" />
            <line class="grid-line" x1="0" y1="480" x2="1000" y2="480" />
            <line class="grid-line" x1="200" y1="0" x2="200" y2="640" />
            <line class="grid-line" x1="400" y1="0" x2="400" y2="640" />
            <line class="grid-line" x1="600" y1="0" x2="600" y2="640" />
            <line class="grid-line" x1="800" y1="0" x2="800" y2="640" />
          </g>
          <path class="arc" d="M120,120 Q430,20 520,320" />
          <path class="arc a2" d="M900,180 Q640,120 520,320" />
          <path class="arc a3" d="M180,560 Q420,520 520,320" />
          <circle class="hq" cx="520" cy="320" r="5" />
        </svg>
      </div>

      <main class="cover" role="main">
        <div class="cover-inner">
          <div class="stamp">Restricted</div>
          <div class="letterhead">
            <span>Internal Distribution</span>
            <span class="case-no">Case&nbsp;SOC-0007</span>
          </div>

          <div class="brand">
            <div class="brand-mark">S</div>
            <div>
              <h1>Sentinel</h1>
              <p>Behavioral SOC Report</p>
            </div>
          </div>

          <h2>Analyst access</h2>
          <p class="lede">
            Sign in to open the live behavioral threat console. Access is logged
            to this case file.
          </p>

          <div class="field">
            <label for="usernameInput">Analyst ID</label>
            <input
              id="usernameInput"
              placeholder="username"
              autocomplete="username"
              autofocus
            />
          </div>
          <div class="field">
            <label for="passwordInput">Passphrase</label>
            <input
              id="passwordInput"
              type="password"
              placeholder="password"
              autocomplete="current-password"
            />
          </div>

          <button class="signin" id="loginBtn">Sign in</button>
          <p
            class="status"
            id="loginStatus"
            role="status"
            aria-live="polite"
          ></p>
        </div>
        <div class="cover-foot">
          <span class="dot"></span>
          <span>Detection pipeline online</span>
        </div>
      </main>
    </div>

    <p class="demo-hint">Demo credentials — <b>admin</b> / <b>admin123</b></p>

    <script>
      (function () {
        const AUTH_KEY = "sentinel_auth";
        const USER_KEY = "sentinel_user";

        // Already signed in? Skip straight to the console.
        if (sessionStorage.getItem(AUTH_KEY)) {
          location.replace("/");
          return;
        }

        const $ = (id) => document.getElementById(id);
        const btn = $("loginBtn");
        const status = $("loginStatus");
        const user = $("usernameInput");
        const pass = $("passwordInput");

        async function signIn() {
          const username = user.value.trim();
          const password = pass.value;
          if (!username || !password) {
            status.className = "status err";
            status.textContent = "Enter an analyst ID and passphrase.";
            return;
          }
          btn.disabled = true;
          status.className = "status";
          status.textContent = "Verifying credentials…";
          try {
            const r = await fetch(`${window.API_BASE}/auth/admin/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            if (!r.ok) throw new Error(String(r.status));
            const data = await r.json();
            // Signing in also starts the backend replay server-side, so the
            // console is already streaming by the time we arrive there.
            sessionStorage.setItem(AUTH_KEY, data.token || "session");
            sessionStorage.setItem(
              USER_KEY,
              (data.user && data.user.name) || username,
            );
            status.className = "status ok";
            status.textContent = `Signed in as ${
              (data.user && data.user.name) || username
            } — opening console…`;
            setTimeout(() => location.replace("/"), 500);
          } catch (e) {
            btn.disabled = false;
            status.className = "status err";
            status.textContent =
              "Invalid credentials. Check your ID and passphrase.";
          }
        }

        btn.addEventListener("click", signIn);
        [user, pass].forEach((el) =>
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") signIn();
          }),
        );
      })();
    </script>
  </body>
</html>
